name: Nimino Site Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: nimino-site-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-host:
    # Cocoa and WKWebView cannot be cross-compiled from the Linux toolchain,
    # so the macOS runtime is built here and handed to the release job as a
    # file. GitHub-hosted macOS runners are Apple Silicon, and Apple sells no
    # Intel Macs, so arm64 is the only architecture published.
    name: Build the macOS host
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Install Nim
        run: |
          set -eu
          brew install nim
          nim --version | head -1

      - name: Build the generic macOS host
        run: |
          set -eu
          nim c --mm:arc --out:nimino-host \
            --path:packages/core --path:packages/native --path:packages/wsl \
            tools/hosts/nimino_host.nim
          test -x nimino-host
          file nimino-host | grep -q arm64

      - name: Upload the host for the release job
        uses: actions/upload-artifact@v4
        with:
          name: nimino-host-macos-arm64
          path: nimino-host
          if-no-files-found: error
          retention-days: 1

  build-and-release:
    name: Build and publish site installers
    needs: macos-host
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pinned Docker toolchain
        run: docker compose build nimino-dev

      - name: Fetch the macOS host built on the macOS runner
        uses: actions/download-artifact@v4
        with:
          name: nimino-host-macos-arm64
          path: .macos-host

      - name: Build site installers and checksums
        run: |
          set -eu
          # The container reads this path; the archive is staged beside the
          # Linux and Windows ones by build_component_release.sh.
          chmod +x .macos-host/nimino-host
          # Rootful Docker on the runner creates workspace output as root.
          # Pre-create .tmp as the runner user so later steps can write
          # their own entries beside the container-owned build output.
          mkdir -p .tmp
          docker compose run --rm -e NIMINO_MACOS_HOST=/workspace/.macos-host/nimino-host \
            nimino-dev bash -lc 'export PATH=/opt/nim/bin:$PATH; bash tools/ci/run_nimble_task.sh testSiteRelease'
          test -s .tmp/site-release/RELEASE-NOTES.txt
          test -s .tmp/site-release/assets/SHA256SUMS
          (cd .tmp/site-release/assets && sha256sum -c SHA256SUMS)

      - name: Generate signed Popular Packages catalog
        env:
          NIMINO_POPULAR_CATALOG_SECRET_KEY: ${{ secrets.NIMINO_POPULAR_CATALOG_SECRET_KEY }}
          NIMINO_POPULAR_CATALOG_PUBLIC_KEY: ${{ secrets.NIMINO_POPULAR_CATALOG_PUBLIC_KEY }}
          NIMINO_POPULAR_CATALOG_KEY_ID: ${{ secrets.NIMINO_POPULAR_CATALOG_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$NIMINO_POPULAR_CATALOG_SECRET_KEY" || {
            echo 'NIMINO_POPULAR_CATALOG_SECRET_KEY repository secret is required' >&2
            exit 1
          }
          test -n "$NIMINO_POPULAR_CATALOG_PUBLIC_KEY" || {
            echo 'NIMINO_POPULAR_CATALOG_PUBLIC_KEY repository secret is required' >&2
            exit 1
          }
          test -n "$NIMINO_POPULAR_CATALOG_KEY_ID" || {
            echo 'NIMINO_POPULAR_CATALOG_KEY_ID repository secret is required' >&2
            exit 1
          }
          mkdir -p .tmp/popular-catalog-signing
          printf '%s' "$NIMINO_POPULAR_CATALOG_SECRET_KEY" > .tmp/popular-catalog-signing/release.key
          printf '%s' "$NIMINO_POPULAR_CATALOG_PUBLIC_KEY" > .tmp/popular-catalog-signing/release.pub
          docker compose run --rm \
            -e CATALOG_TAG="$RELEASE_TAG" \
            -e CATALOG_COMMIT="$GITHUB_SHA" \
            -e CATALOG_RUN_ID="$GITHUB_RUN_ID" \
            -e CATALOG_KEY_ID="$NIMINO_POPULAR_CATALOG_KEY_ID" \
            nimino-dev bash -lc 'python3 tools/ci/generate_popular_catalog.py \
              --assets-dir /workspace/.tmp/site-release/assets \
              --output /workspace/.tmp/site-release/assets/popular-packages.json \
              --tag "$CATALOG_TAG" --commit "$CATALOG_COMMIT" --run-id "$CATALOG_RUN_ID" \
              --secret-key /workspace/.tmp/popular-catalog-signing/release.key \
              --key-id "$CATALOG_KEY_ID" \
              && cp /workspace/.tmp/popular-catalog-signing/release.pub \
                /workspace/.tmp/site-release/assets/nimino-popular-packages.pub'
          rm -rf .tmp/popular-catalog-signing
          test -s .tmp/site-release/assets/popular-packages.json
          test -s .tmp/site-release/assets/nimino-popular-packages.pub

      - name: Upload build output for inspection
        uses: actions/upload-artifact@v4
        with:
          name: nimino-sites-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: .tmp/site-release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "Nimino $RELEASE_TAG" \
              --notes-file .tmp/site-release/RELEASE-NOTES.txt \
              --verify-tag
          gh release upload "$RELEASE_TAG" \
            .tmp/site-release/RELEASE-NOTES.txt \
            .tmp/site-release/assets/* --clobber

  publish-container:
    # The image ships the CLI, and the CLI downloads a host for its own
    # version, so it is only usable once the release it names exists. Publish
    # after the release job, not beside it.
    name: Publish the packaging container
    needs: build-and-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the distribution image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/docker/Dockerfile
          target: dist
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Verify the published image wraps a URL
        run: |
          set -eu
          image=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker pull "$image"
          # A published image that cannot reach the release it was built from
          # is worse than no image: the failure surfaces at the user's first
          # command, not here.
          mkdir -p "$RUNNER_TEMP/probe"
          docker run --rm -v "$RUNNER_TEMP/probe:/work" "$image" \
            pack https://example.com --name Probe --out /work/app
          test -s "$RUNNER_TEMP/probe/app/nimino-manifest.json"
          test -s "$RUNNER_TEMP/probe/app/nimino-host"
