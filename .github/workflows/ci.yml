name: CI

on:
  # Every branch, not just main: a push that only reaches CI once a pull
  # request exists leaves the work unverified for as long as the branch sits
  # there, which is how breakage gets discovered late.
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nimino-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    name: Common tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The development container runs as a normal user and writes into the
      # checkout, which the runner owns as uid 1001 rather than the uid 1000 a
      # developer's host uses. A chown inside the image cannot change that:
      # the bind mount replaces it. Read the id here instead of hard-coding
      # it, so a runner image that renumbers its account stays covered.
      - name: Match the container user to the checkout owner
        run: |
          set -eu
          {
            echo "NIMINO_UID=$(id -u)"
            echo "NIMINO_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image from the repository Dockerfile
        run: docker compose build nimino-dev

      - name: Run common unit and pack checks
        run: >-
          make
          verify-env
          setup-contract-test
          test
          nimble-install-test
          pack-test
          pack-host-resolution-test
          pack-host-runtime-test
          pack-cli-test
          pack-popular-catalog-test

  linux-gui:
    # The development image ships GTK, WebKitGTK, and Xvfb precisely so these
    # run headless, but nothing ever executed them: the GUI backends, the RPC
    # bootstrap, the custom protocol, and the tray were only exercised by hand.
    name: Linux GUI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The development container runs as a normal user and writes into the
      # checkout, which the runner owns as uid 1001 rather than the uid 1000 a
      # developer's host uses. A chown inside the image cannot change that:
      # the bind mount replaces it. Read the id here instead of hard-coding
      # it, so a runner image that renumbers its account stays covered.
      - name: Match the container user to the checkout owner
        run: |
          set -eu
          {
            echo "NIMINO_UID=$(id -u)"
            echo "NIMINO_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image from the repository Dockerfile
        run: docker compose build nimino-dev

      - name: Run the Xvfb-backed Linux smoke tests
        run: >-
          make
          linux-smoke
          linux-custom-protocol-smoke
          linux-tray-smoke
          core-linux-rpc-smoke
          core-linux-rpc-url-smoke
          core-linux-rpc-async-smoke

  cross-build:
    # Windows and WSL targets are cross-compiled, so they need no Windows
    # host to be checked -- only the mingw toolchain the image already has.
    name: Cross builds and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The development container runs as a normal user and writes into the
      # checkout, which the runner owns as uid 1001 rather than the uid 1000 a
      # developer's host uses. A chown inside the image cannot change that:
      # the bind mount replaces it. Read the id here instead of hard-coding
      # it, so a runner image that renumbers its account stays covered.
      - name: Match the container user to the checkout owner
        run: |
          set -eu
          {
            echo "NIMINO_UID=$(id -u)"
            echo "NIMINO_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image from the repository Dockerfile
        run: docker compose build nimino-dev

      - name: Cross-compile the Windows and WSL targets
        run: >-
          make
          windows-cross
          core-windows-cross
          wsl-host-cross

      - name: Build the Linux and Windows packages
        run: >-
          make
          pack-linux-test
          pack-windows-test
          pack-sites-test

      # Cross-build the bundle the Windows GUI smoke launches. Only this image
      # has the mingw toolchain and the staged WebView2/PCRE DLLs.
      - name: Build the Windows GUI smoke bundle
        run: |
          set -eu
          mkdir -p .tmp
          docker compose run --rm nimino-dev bash -lc \
            'export PATH=/opt/nim/bin:$PATH; bash tools/ci/run_nimble_task.sh buildPackWindowsSmokeArtifact'

      - name: Upload the Windows GUI smoke bundle
        uses: actions/upload-artifact@v4
        with:
          name: pack-windows-smoke-bundle
          if-no-files-found: error
          path: .tmp/pack-windows-smoke/

  packaging-formats:
    # AppImage and the archive/online flows run entirely in the development
    # image: appimagetool and linuxdeploy are wrapped with
    # APPIMAGE_EXTRACT_AND_RUN so none of this needs FUSE.
    name: Packaging formats
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The development container runs as a normal user and writes into the
      # checkout, which the runner owns as uid 1001 rather than the uid 1000 a
      # developer's host uses. A chown inside the image cannot change that:
      # the bind mount replaces it. Read the id here instead of hard-coding
      # it, so a runner image that renumbers its account stays covered.
      - name: Match the container user to the checkout owner
        run: |
          set -eu
          {
            echo "NIMINO_UID=$(id -u)"
            echo "NIMINO_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image from the repository Dockerfile
        run: docker compose build nimino-dev

      - name: Verify the AppImage closure and its guardrails
        run: >-
          make
          pack-appimage-guardrails
          pack-appimage-test

      - name: Verify the archive, online, and catalog flows
        run: >-
          make
          pack-archive-test
          pack-online-test
          pack-popular-catalog-generation-test

  release-artifacts:
    # The release path used to be verified only when a tag was pushed, so its
    # checks first ran at the moment they had to pass. That is how seven
    # releases shipped with no application icon. Rebuild the site installers
    # and the component archives on every change instead, and verify them with
    # exactly the scripts the release workflow runs.
    name: Release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The development container runs as a normal user and writes into the
      # checkout, which the runner owns as uid 1001 rather than the uid 1000 a
      # developer's host uses. A chown inside the image cannot change that:
      # the bind mount replaces it. Read the id here instead of hard-coding
      # it, so a runner image that renumbers its account stays covered.
      - name: Match the container user to the checkout owner
        run: |
          set -eu
          {
            echo "NIMINO_UID=$(id -u)"
            echo "NIMINO_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image from the repository Dockerfile
        run: docker compose build nimino-dev

      - name: Rebuild and verify the site installers and component archives
        run: |
          set -eu
          # Rootful Docker on the runner creates workspace output as root, so
          # pre-create .tmp as the runner user, exactly as the release
          # workflow does.
          mkdir -p .tmp
          make pack-site-release-test

  windows-gui:
    # Windows is a primary target and had no runtime verification at all: the
    # cross-build job proves the host links and is a GUI-subsystem PE, nothing
    # proved it starts. The smoke script needs a Windows desktop and the
    # WebView2 runtime, both of which a GitHub-hosted Windows runner provides
    # -- it does not need WSL, which is only how a developer reaches Windows
    # from their own machine.
    name: Windows GUI smoke
    runs-on: windows-2025
    needs: cross-build
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # A Windows runner cannot run the Linux development image, so the bundle
      # is cross-built by the Linux job and carried over as an artifact. It is
      # self-contained: the host, the manifest, WebView2Loader.dll and
      # pcre64.dll all travel with it.
      - name: Download the cross-built Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: pack-windows-smoke-bundle
          path: .tmp/pack-windows-smoke

      - name: Launch the packaged application and verify it starts
        shell: pwsh
        run: |
          ./tools/ci/pack-windows-smoke.ps1 -BundleDirectory (Resolve-Path .tmp/pack-windows-smoke)

  macos:
    # Cocoa and WKWebView cannot be built in the Linux development image, so
    # the macOS suites were the one part of the tree that only ever ran when
    # someone remembered to run them by hand on a Mac. GitHub-hosted macOS
    # runners are free for public repositories, which covers that gap without
    # attaching a self-hosted machine to a repository anyone can fork.
    name: macOS suites
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nim
        run: |
          set -eu
          brew install nim
          nim --version | head -1

      - name: Run the macOS reference-parity suites
        env:
          NIMINO_TEST_REFERENCE_MACOS: "1"
        run: bash tools/ci/run_nimble_task.sh testReferenceParity

  flatpak:
    # flatpak-builder launches bubblewrap and needs a user namespace, which is
    # why compose keeps that privilege on its own service.
    name: Flatpak packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The development container runs as a normal user and writes into the
      # checkout, which the runner owns as uid 1001 rather than the uid 1000 a
      # developer's host uses. A chown inside the image cannot change that:
      # the bind mount replaces it. Read the id here instead of hard-coding
      # it, so a runner image that renumbers its account stays covered.
      - name: Match the container user to the checkout owner
        run: |
          set -eu
          {
            echo "NIMINO_UID=$(id -u)"
            echo "NIMINO_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image from the repository Dockerfile
        run: docker compose build nimino-dev

      - name: Build and export a real Flatpak bundle
        run: make pack-flatpak-test

  rpm-centos:
    # The generated RPM is installed and launched inside a CentOS Stream 10
    # container, so this one drives the runner's container runtime directly
    # rather than running inside the development image.
    name: RPM install smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The development container runs as a normal user and writes into the
      # checkout, which the runner owns as uid 1001 rather than the uid 1000 a
      # developer's host uses. A chown inside the image cannot change that:
      # the bind mount replaces it. Read the id here instead of hard-coding
      # it, so a runner image that renumbers its account stays covered.
      - name: Match the container user to the checkout owner
        run: |
          set -eu
          {
            echo "NIMINO_UID=$(id -u)"
            echo "NIMINO_GID=$(id -g)"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image from the repository Dockerfile
        run: docker compose build nimino-dev

      - name: Install and launch the RPM in CentOS Stream 10
        run: make rpm-centos-smoke
